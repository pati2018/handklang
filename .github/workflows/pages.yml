name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Die Erkennungs-Modelle (Apache-2.0, Google MediaPipe) werden beim
      # Veröffentlichen einmal geladen und mit der Seite ausgeliefert.
      # Besucher laden sie danach von GitHub Pages, nicht von Google.
      - name: Erkennungs-Modelle laden
        run: |
          mkdir -p models
          curl -fsSL -o models/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          curl -fsSL -o models/selfie_segmenter.tflite \
            https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite
          ls -lh models

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
